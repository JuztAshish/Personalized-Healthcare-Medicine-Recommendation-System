{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="card-title h4">Patient Profile</h1>
        <p class="text-muted small">Save your basic health details. All fields are optional. This information is for academic/demo use only.</p>
        <form method="post" action="/profile">
          <div class="row">
            <div class="col-md-4 mb-3">
              <label for="age" class="form-label">Age</label>
              <input type="number" min="0" max="120" class="form-control" id="age" name="age" value="{{ profile.get('age', '') }}" placeholder="e.g. 25">
            </div>
            <div class="col-md-4 mb-3">
              <label for="gender" class="form-label">Gender</label>
              <select class="form-select" id="gender" name="gender">
                {% for g in gender_choices %}
                  <option value="{{ g }}" {% if profile.get('gender', '') == g %}selected{% endif %}>{{ g if g else 'Select' }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label for="blood_group" class="form-label">Blood Group</label>
              <select class="form-select" id="blood_group" name="blood_group">
                {% for bg in blood_group_choices %}
                  <option value="{{ bg }}" {% if profile.get('blood_group', '') == bg %}selected{% endif %}>{{ bg if bg else 'Select' }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" name="phone" value="{{ profile.get('phone', '') }}" placeholder="Optional">
          </div>
          <div class="mb-3">
            <label for="allergies" class="form-label">Known Allergies</label>
            <textarea class="form-control" id="allergies" name="allergies" rows="2" placeholder="e.g. penicillin, peanuts (optional)">{{ profile.get('allergies', '') }}</textarea>
          </div>
          <div class="mb-3">
            <label for="medical_history" class="form-label">Existing Conditions / Medical History</label>
            <textarea class="form-control" id="medical_history" name="medical_history" rows="3" placeholder="Optional">{{ profile.get('medical_history', '') }}</textarea>
          </div>
          <div class="mb-3">
            <label for="current_medications" class="form-label">Current Medications</label>
            <textarea class="form-control" id="current_medications" name="current_medications" rows="2" placeholder="Optional">{{ profile.get('current_medications', '') }}</textarea>
          </div>
          <div class="mb-3">
            <label for="emergency_contact" class="form-label">Emergency Contact</label>
            <input type="text" class="form-control" id="emergency_contact" name="emergency_contact" value="{{ profile.get('emergency_contact', '') }}" placeholder="Name / phone (optional)">
          </div>
          <button type="submit" class="btn btn-primary">Save Profile</button>
          <a class="btn btn-outline-secondary" href="/dashboard">Back to Dashboard</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
