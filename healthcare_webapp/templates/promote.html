{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="card-title h4">Promote User to Admin</h1>
        <p class="text-muted small">Only admins can promote existing registered users.</p>
        <form method="post" action="/admin/promote">
          <div class="mb-3">
            <label for="email" class="form-label">User Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Enter user's email" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Promote to Admin</button>
        </form>
        <hr>
        <a class="btn btn-link" href="/admin">Back to Admin</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
